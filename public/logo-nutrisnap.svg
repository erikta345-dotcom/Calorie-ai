<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="lineScanGlow" x="0%" y="-500%" width="100%" height="1100%">
      <feGaussianBlur stdDeviation="12" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge><feMergeNode in="blur2"/><feMergeNode in="blur1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="scannedFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84cc16" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="metalGreen" x1="52" y1="14" x2="498" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="30%" stop-color="#5e9f08"/>
      <stop offset="43%" stop-color="#9cde38"/>
      <stop offset="48%" stop-color="#f0ffd0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="53%" stop-color="#c7f47b"/>
      <stop offset="66%" stop-color="#5e9f08"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <linearGradient id="metalCyan" x1="498" y1="256" x2="414" y2="498" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="30%" stop-color="#087f96"/>
      <stop offset="43%" stop-color="#45d8ed"/>
      <stop offset="48%" stop-color="#c3faff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="53%" stop-color="#a0f1fa"/>
      <stop offset="66%" stop-color="#087f96"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="metalOrange" x1="414" y1="498" x2="14" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="30%" stop-color="#a93d0b"/>
      <stop offset="43%" stop-color="#f47b2a"/>
      <stop offset="48%" stop-color="#ffd0a0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="53%" stop-color="#ffb873"/>
      <stop offset="66%" stop-color="#a93d0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="metalGold" x1="14" y1="360" x2="52" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="30%" stop-color="#9c7100"/>
      <stop offset="43%" stop-color="#dfb51e"/>
      <stop offset="48%" stop-color="#fff2a6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="53%" stop-color="#f7dc72"/>
      <stop offset="66%" stop-color="#9c7100"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="100"/>
    </clipPath>
    <clipPath id="scanAreaClip">
      <rect x="96" y="96" width="320" height="320"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="#09090b"/>

  <!-- Rounded rect border split into 3 segments, clipped to icon -->
  <!-- Border sits at inset=14, rx=86 so it fits within the rounded icon edges -->
  <g transform="translate(2 0)" clip-path="url(#iconClip)" fill="none" stroke-width="22" stroke-linecap="butt">
    <!-- Track (dark) -->
    <rect x="14" y="14" width="484" height="484" rx="86" fill="none" stroke="#1a1a22" stroke-width="22"/>
    <!-- Dominant lime segment: most of the top and the full right side -->
    <path d="M 52 14 L 414 14 A 86 86 0 0 1 498 100 L 498 256"
      stroke="url(#metalGreen)"/>
    <!-- Small cyan segment: mid right → bottom-right corner -->
    <path d="M 498 256 L 498 414 A 86 86 0 0 1 414 498"
      stroke="url(#metalCyan)"/>
    <!-- Medium orange segment: most of the bottom and lower left side -->
    <path d="M 414 498 L 98 498 A 86 86 0 0 1 14 414 L 14 360"
      stroke="url(#metalOrange)"/>
    <!-- Small yellow accent: only the upper-left corner and a little of each side -->
    <path d="M 14 360 L 14 100 A 86 86 0 0 1 100 14 L 52 14"
      stroke="url(#metalGold)"/>
  </g>

  <!-- Scan brackets with rounded corners via arc -->
  <g transform="translate(2 0)" fill="none" stroke-linecap="round">
    <g stroke="rgba(255,255,255,0.75)" stroke-width="10">
    <path d="M 96 136 L 96 110 A 14 14 0 0 1 110 96 L 136 96"/>
    <path d="M 376 96 L 402 96 A 14 14 0 0 1 416 110 L 416 136"/>
    <path d="M 96 376 L 96 402 A 14 14 0 0 0 110 416 L 136 416"/>
    <path d="M 376 416 L 402 416 A 14 14 0 0 0 416 402 L 416 376"/>
    </g>
  </g>

  <!-- Scanned region behind the apple, clipped to the scanner area -->
  <rect x="96" y="280" width="320" height="136"
    fill="url(#scannedFill)"
    clip-path="url(#scanAreaClip)"/>

  <!-- Pear silhouette based on the user's reference -->
  <g transform="translate(2 0) translate(117 10) scale(0.54 0.77)">
    <path d="M 256 222 C 256 201 266 184 283 172" fill="none" stroke="#407b28" stroke-width="11" stroke-linecap="round"/>
    <path d="M 263 188 C 267 166 304 151 354 157 C 338 180 306 193 263 188 Z" fill="#22a83c"/>
    <path d="M 170 301 C 178 264 188 222 224 204 C 243 194 271 194 290 205 C 326 226 331 269 340 304 C 352 347 394 380 394 422 C 394 480 338 501 256 501 C 174 501 118 480 118 422 C 118 380 158 347 170 301 Z" fill="#92bd16" stroke="#09090b" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 164 366 C 174 338 188 321 199 326 C 212 331 193 359 186 388 C 179 417 180 445 168 445 C 154 445 147 414 151 392 C 154 380 158 373 164 366 Z" fill="#fffdf7"/>
  </g>

  <!-- Main scan line -->
  <rect x="98" y="275" width="320" height="6"
    fill="#84cc16" opacity="0.85"
    filter="url(#lineScanGlow)"/>
</svg>
