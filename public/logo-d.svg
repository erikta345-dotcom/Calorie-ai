<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#09090b"/>

  <!-- Pixel flame — 6 cols × 7 rows, step=50px, size=44px -->
  <!-- Colors: tip=bright lime→base=dark lime (light at top, dark at bottom) -->

  <!-- Row 0 y=84: cols 2,3 — tip -->
  <rect x="209" y="84"  width="44" height="44" rx="7" fill="#ecfccb"/>
  <rect x="259" y="84"  width="44" height="44" rx="7" fill="#ecfccb"/>

  <!-- Row 1 y=134: cols 1-4 -->
  <rect x="159" y="134" width="44" height="44" rx="7" fill="#d9f99d"/>
  <rect x="209" y="134" width="44" height="44" rx="7" fill="#d9f99d"/>
  <rect x="259" y="134" width="44" height="44" rx="7" fill="#d9f99d"/>
  <rect x="309" y="134" width="44" height="44" rx="7" fill="#d9f99d"/>

  <!-- Row 2 y=184: cols 1-5 (lean right) -->
  <rect x="159" y="184" width="44" height="44" rx="7" fill="#bef264"/>
  <rect x="209" y="184" width="44" height="44" rx="7" fill="#bef264"/>
  <rect x="259" y="184" width="44" height="44" rx="7" fill="#bef264"/>
  <rect x="309" y="184" width="44" height="44" rx="7" fill="#bef264"/>
  <rect x="359" y="184" width="44" height="44" rx="7" fill="#bef264"/>

  <!-- Row 3 y=234: cols 0-5 (full) -->
  <rect x="109" y="234" width="44" height="44" rx="7" fill="#a3e635"/>
  <rect x="159" y="234" width="44" height="44" rx="7" fill="#a3e635"/>
  <rect x="209" y="234" width="44" height="44" rx="7" fill="#a3e635"/>
  <rect x="259" y="234" width="44" height="44" rx="7" fill="#a3e635"/>
  <rect x="309" y="234" width="44" height="44" rx="7" fill="#a3e635"/>
  <rect x="359" y="234" width="44" height="44" rx="7" fill="#a3e635"/>

  <!-- Row 4 y=284: cols 0-5 (full) -->
  <rect x="109" y="284" width="44" height="44" rx="7" fill="#84cc16"/>
  <rect x="159" y="284" width="44" height="44" rx="7" fill="#84cc16"/>
  <rect x="209" y="284" width="44" height="44" rx="7" fill="#84cc16"/>
  <rect x="259" y="284" width="44" height="44" rx="7" fill="#84cc16"/>
  <rect x="309" y="284" width="44" height="44" rx="7" fill="#84cc16"/>
  <rect x="359" y="284" width="44" height="44" rx="7" fill="#84cc16"/>

  <!-- Row 5 y=334: cols 1-4 (taper) -->
  <rect x="159" y="334" width="44" height="44" rx="7" fill="#65a30d"/>
  <rect x="209" y="334" width="44" height="44" rx="7" fill="#65a30d"/>
  <rect x="259" y="334" width="44" height="44" rx="7" fill="#65a30d"/>
  <rect x="309" y="334" width="44" height="44" rx="7" fill="#65a30d"/>

  <!-- Row 6 y=384: cols 2,3 — base -->
  <rect x="209" y="384" width="44" height="44" rx="7" fill="#4d7c0f"/>
  <rect x="259" y="384" width="44" height="44" rx="7" fill="#4d7c0f"/>
</svg>
