<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bgGrad" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#141418"/>
      <stop offset="100%" stop-color="#09090b"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad)"/>

  <!-- Ring track -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#1c1c24" stroke-width="28"/>

  <!-- Active ring: 270° (75%) — starts at 12-o'clock, gap at bottom-left -->
  <!-- circumference = 2*pi*178 ≈ 1118.46 | 75% ≈ 839 | gap ≈ 279 -->
  <circle cx="256" cy="256" r="178" fill="none" stroke="#84cc16" stroke-width="28"
    stroke-dasharray="839 280" stroke-linecap="round"
    transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- Lightning bolt: centered at (256,256) — 256px tall, ~96px wide -->
  <path d="M286 128 L208 272 L256 272 L220 384 L304 240 L254 240 Z"
    fill="#84cc16" filter="url(#softglow)"/>
</svg>
