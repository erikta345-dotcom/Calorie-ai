<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#09090b"/>

  <!-- Bold C: opens on right side, 300° arc -->
  <!-- top opening: (395, 176), bottom opening: (395, 336) -->
  <path d="M 395 176 A 160 160 0 1 0 395 336"
    fill="none" stroke="#84cc16" stroke-width="72" stroke-linecap="round"
    filter="url(#glow)"/>

  <!-- Center spark: 3 small lines radiating -->
  <line x1="256" y1="232" x2="256" y2="244" stroke="#84cc16" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="256" y1="268" x2="256" y2="280" stroke="#84cc16" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="232" y1="256" x2="244" y2="256" stroke="#84cc16" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="268" y1="256" x2="280" y2="256" stroke="#84cc16" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="8" fill="#84cc16" filter="url(#glow)"/>
</svg>
